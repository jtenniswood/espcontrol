# =============================================================================
# CONFIG: BUTTON TEMPLATE (parameterized by ${num})
# =============================================================================
# Compact per-button config for smaller devices. Keeps the main button config
# plus four subpage chunks instead of the full eight-chunk template.
# =============================================================================

text:
  - platform: espcontrol
    id: button_${num}_config
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_2
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_3
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid
