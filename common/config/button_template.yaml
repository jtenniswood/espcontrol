# =============================================================================
# CONFIG: BUTTON TEMPLATE (parameterized by ${num})
# =============================================================================
# Per-button config stored as a single semicolon-delimited string:
#   entity_id;label;icon;icon_on;sensor;sensor_unit;type;precision;options
# Subpage config kept separate; split across text entities because ESPHome caps
# each text max_length at 255.
# Included once per button slot from packages.yaml with vars: { num: "N" }.
# =============================================================================

text:
  - platform: espcontrol
    id: button_${num}_config
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_2
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_3
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_4
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_5
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_6
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid

  - platform: espcontrol
    id: subpage_${num}_config_ext_7
    initial_value: ""
    on_value:
      then:
        - script.execute: refresh_subpage_grid
