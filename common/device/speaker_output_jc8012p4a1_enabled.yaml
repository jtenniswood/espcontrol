# Speaker-only output for the Guition JC8012P4A1 family.
# The board's ES8311 codec drives the onboard NS4150B amplifier.

i2s_audio:
  - id: jc8012_speaker_i2s
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: jc8012_speaker_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: jc8012_speaker_output
    i2s_audio_id: jc8012_speaker_i2s
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: jc8012_speaker_dac
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 100ms
    use_apll: true

  - platform: mixer
    id: jc8012_speaker_mixer
    output_speaker: jc8012_speaker_output
    source_speakers:
      - id: jc8012_announcement_input
      - id: jc8012_media_input

  - platform: resampler
    id: jc8012_announcement_resampler
    output_speaker: jc8012_announcement_input
    sample_rate: 16000

  - platform: resampler
    id: jc8012_media_resampler
    output_speaker: jc8012_media_input
    sample_rate: 16000

switch:
  - platform: gpio
    id: jc8012_speaker_amplifier
    name: "${friendly_name} Speaker Amplifier"
    icon: mdi:speaker
    pin: GPIO20
    restore_mode: ALWAYS_OFF
    internal: true

script:
  - id: jc8012_speaker_amplifier_off_if_unused
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            and:
              - not:
                  media_player.is_playing: jc8012_speaker
              - not:
                  media_player.is_announcing: jc8012_speaker
          then:
            - switch.turn_off: jc8012_speaker_amplifier

media_player:
  - platform: speaker
    id: jc8012_speaker
    name: "${friendly_name} Speaker"
    volume_min: 0.0
    volume_max: 0.8
    # ESPHome defaults to 1 MB per pipeline. Keep the two pipelines bounded.
    buffer_size: 500000
    media_pipeline:
      speaker: jc8012_media_resampler
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    announcement_pipeline:
      speaker: jc8012_announcement_resampler
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    on_play:
      - audio_dac.set_volume:
          id: jc8012_speaker_dac
          volume: 0.7
      - switch.turn_on: jc8012_speaker_amplifier
    on_announcement:
      - audio_dac.set_volume:
          id: jc8012_speaker_dac
          volume: 0.7
      - switch.turn_on: jc8012_speaker_amplifier
    on_idle:
      - script.execute: jc8012_speaker_amplifier_off_if_unused
    on_pause:
      - script.execute: jc8012_speaker_amplifier_off_if_unused
