# =============================================================================
# CLOCK SCREENSAVER - Full-screen clock overlay for idle display
# =============================================================================
# Black overlay with a large light-weight time label. Hidden by default; shown
# by backlight.yaml when the clock screensaver is enabled and the idle
# timeout fires. The label is positioned absolutely so the interval can
# drift it for burn-in prevention.
#
# The transparent image overlay below is independent from the black clock
# screensaver. It is hidden by default and only shown over cover art/camera
# views when the optional clock overlay setting is enabled. Photo metadata
# can appear independently in camera mode and reuses the existing body font.
# Both use matching text shadows instead of blur to keep S3 overhead low.
# =============================================================================

substitutions:
  clock_date_font: font_text_title

globals:
  - id: screensaver_sensor_subscribed_entity
    type: std::string
    initial_value: '""'
  - id: screensaver_sensor_subscription_generation
    type: uint32_t
    initial_value: '0'
  - id: screensaver_sensor_state
    type: std::string
    initial_value: '""'
  - id: screensaver_sensor_presentation_active
    type: bool
    initial_value: 'false'
  - id: photo_metadata_subscribed_entity
    type: std::string
    initial_value: '""'
  - id: photo_metadata_subscription_generation
    type: uint32_t
    initial_value: '0'
  - id: photo_metadata_value
    type: std::string
    initial_value: '""'

font:
  # The clock and numeric sensor reading share this small 2-bit font.
  # The 4.3-inch P4 also reuses these digits for its landscape volume dial.
  - file: "gfonts://Roboto@Light"
    id: font_clock_display
    size: ${clock_font_size}
    bpp: 2
    glyphs: "0123456789:.+-%eE—"

lvgl:
  top_layer:
    widgets:
      - obj:
          id: clock_screensaver
          x: 0
          y: 0
          width: 100%
          height: 100%
          # The saved clock text colour is independent of the theme. Keep its
          # content background black so the default white stays readable.
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: clock_label
                text_font: font_clock_display
                text_color: 0xFFFFFF
                text: "00:00"
            - label:
                id: clock_date_label
                text_font: ${clock_date_font}
                text_color: 0xFFFFFF
                text_align: CENTER
                text: ""
                hidden: true
            - obj:
                id: screensaver_sensor_reading
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                hidden: true
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_cross: center
                  pad_row: 4
                widgets:
                  - obj:
                      width: SIZE_CONTENT
                      height: SIZE_CONTENT
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      clickable: false
                      layout:
                        type: flex
                        flex_flow: ROW
                        flex_align_cross: end
                        pad_column: 6
                      widgets:
                        - label:
                            id: screensaver_sensor_value_label
                            text_font: font_clock_display
                            text_align: CENTER
                            long_mode: DOT
                            text: "—"
                        - label:
                            id: screensaver_sensor_unit_label
                            text_font: ${clock_date_font}
                            long_mode: DOT
                            text: ""
                            hidden: true
                  - label:
                      id: screensaver_sensor_caption
                      text_font: ${clock_date_font}
                      text_align: CENTER
                      long_mode: DOT
                      text: ""
      - obj:
          id: clock_image_overlay
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: false
          hidden: true
          widgets:
            - label:
                id: clock_image_overlay_shadow
                text_font: font_clock_display
                text_color: 0x000000
                text_opa: 20%
                text: "00:00"
            - label:
                id: clock_image_overlay_label
                text_font: font_clock_display
                text_color: 0xFFFFFF
                text: "00:00"
            - label:
                id: photo_metadata_shadow
                text_font: font_text_body
                text_color: 0x000000
                text_opa: 20%
                long_mode: DOT
                text: ""
                hidden: true
            - label:
                id: photo_metadata_label
                text_font: font_text_body
                text_color: 0xFFFFFF
                long_mode: DOT
                text: ""
                hidden: true
      - obj:
          id: dim_screensaver_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          on_press:
            then:
              - script.execute: screensaver_wake
      - obj:
          id: screensaver_wake_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true

script:
  - id: screensaver_sensor_refresh_subscription
    then:
      - lambda: |-
          const auto transition = id(espcontrol_app).display().resolve();
          const bool active = id(screensaver_action_sensor_value) &&
              transition.target_mode == espcontrol::DisplayMode::CLOCK &&
              transition.winning_source != espcontrol::DisplayRequestSource::SCREEN_SCHEDULE;
          static uint32_t last_drift_minute = 0;
          const uint32_t drift_minute = millis() / 60000;
          const bool refresh = active != id(screensaver_sensor_presentation_active) ||
              (active && drift_minute != last_drift_minute);
          last_drift_minute = drift_minute;
          id(screensaver_sensor_presentation_active) = active;
          const auto &configured = id(screensaver_sensor_entity).state;
          const std::string entity = active && ha_api_state_connected() &&
              configured.rfind("sensor.", 0) == 0 && configured.size() > 7
              ? configured : std::string();
          const uint32_t generation = entity.empty() ? 0 : ha_subscription_generation();
          if (entity == id(screensaver_sensor_subscribed_entity) &&
              generation == id(screensaver_sensor_subscription_generation)) {
            if (refresh) {
              id(clock_screensaver_refresh_presentation).execute();
            }
            return;
          }

          void *const owner = &id(screensaver_sensor_subscribed_entity);
          ha_release_callbacks_for_owner(owner);
          id(screensaver_sensor_subscribed_entity) = entity;
          id(screensaver_sensor_subscription_generation) = generation;
          id(screensaver_sensor_state).clear();
          id(clock_screensaver_refresh_presentation).execute();
          if (entity.empty()) return;
          {
            HaCallbackOwnerScope scope(owner);
            const bool subscribed = ha_subscribe_state(entity,
              std::function<void(esphome::StringRef)>([entity, generation](esphome::StringRef value) {
                if (!id(screensaver_sensor_presentation_active) || !ha_api_state_connected() ||
                    generation != ha_subscription_generation() ||
                    generation != id(screensaver_sensor_subscription_generation) ||
                    entity != id(screensaver_sensor_subscribed_entity)) return;
                const std::string next = espcontrol::photo_metadata_text(string_ref_limited(value, 260));
                if (next == id(screensaver_sensor_state)) return;
                id(screensaver_sensor_state) = next;
                id(screensaver_sensor_render).execute();
              }));
            if (!subscribed) {
              id(screensaver_sensor_subscribed_entity).clear();
              id(screensaver_sensor_subscription_generation) = 0;
              return;
            }
          }
          ha_reannounce_state_subscriptions();

  # Subscribe only while camera mode is active. Release the owner on exit,
  # entity changes or disconnect; generation checks discard stale callbacks.
  - id: photo_metadata_refresh_subscription
    mode: restart
    then:
      - lambda: |-
          const bool active = id(metadata_overlay_enabled).state && id(espcontrol_app).display().target_mode_is(
              espcontrol::DisplayMode::CAMERA) && ha_api_state_connected();
          const std::string &configured = id(screensaver_metadata_entity).state;
          const std::string entity = active && configured.rfind("sensor.", 0) == 0
              ? configured : std::string();
          const uint32_t generation = entity.empty() ? 0 : ha_subscription_generation();
          if (entity == id(photo_metadata_subscribed_entity) &&
              generation == id(photo_metadata_subscription_generation)) return;
          void *const owner = &id(photo_metadata_subscribed_entity);
          ha_release_callbacks_for_owner(owner);
          id(photo_metadata_subscribed_entity) = entity;
          id(photo_metadata_subscription_generation) = generation;
          id(photo_metadata_value).clear();
          id(clock_overlay_apply).execute(static_cast<int>(id(espcontrol_app).display().current_mode()));
          if (entity.empty()) return;
          {
            HaCallbackOwnerScope scope(owner);
            const bool subscribed = ha_subscribe_state(entity,
              std::function<void(esphome::StringRef)>([entity, generation](esphome::StringRef value) {
                if (!id(metadata_overlay_enabled).state || !ha_api_state_connected() || generation != ha_subscription_generation() ||
                    generation != id(photo_metadata_subscription_generation) ||
                    entity != id(photo_metadata_subscribed_entity) ||
                    entity != id(screensaver_metadata_entity).state ||
                    !id(espcontrol_app).display().target_mode_is(espcontrol::DisplayMode::CAMERA)) return;
                const std::string next = espcontrol::photo_metadata_text(string_ref_limited(value, 260));
                if (next == id(photo_metadata_value)) return;
                id(photo_metadata_value) = next;
                id(clock_overlay_apply).execute(static_cast<int>(espcontrol::DisplayMode::CAMERA));
              }));
            if (!subscribed) {
              id(photo_metadata_subscribed_entity).clear();
              id(photo_metadata_subscription_generation) = 0;
              return;
            }
          }
          ha_reannounce_state_subscriptions();

interval:
  - interval: 1s
    then:
      - script.execute: photo_metadata_refresh_subscription
      - script.execute: screensaver_sensor_refresh_subscription
