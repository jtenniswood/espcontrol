# =============================================================================
# CLOCK SCREENSAVER - Full-screen clock overlay for idle display
# =============================================================================
# Black overlay with a large bold-font time label. Hidden by default; shown
# by backlight.yaml when the clock screensaver is enabled and the idle
# timeout fires. The label is positioned absolutely so the interval can
# drift it for burn-in prevention.
#
# The transparent image overlay below is independent from the black clock
# screensaver. It is hidden by default and only shown over cover art/camera
# views when the optional clock overlay setting is enabled. It uses the same
# dedicated clock font and two labels with the same short text instead of a
# blur or outline to keep S3 overhead negligible.
# =============================================================================

font:
  # Keep this font dedicated to the full-screen clock. The small glyph set and
  # 2-bit anti-aliasing limit flash and RAM use on resource-constrained panels.
  - file: "gfonts://Roboto@Bold"
    id: font_clock_display
    size: ${clock_font_size}
    bpp: 2
    glyphs: "0123456789:"

lvgl:
  top_layer:
    widgets:
      - obj:
          id: clock_screensaver
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: clock_label
                text_font: font_clock_display
                text_color: 0xFFFFFF
                text: "00:00"
      - obj:
          id: clock_image_overlay
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: false
          hidden: true
          widgets:
            - label:
                id: clock_image_overlay_shadow
                text_font: font_clock_display
                text_color: 0x000000
                text_opa: 30%
                text: "00:00"
            - label:
                id: clock_image_overlay_label
                text_font: font_clock_display
                text_color: 0xFFFFFF
                text: "00:00"
      - obj:
          id: dim_screensaver_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          on_press:
            then:
              - script.execute: screensaver_wake
      - obj:
          id: screensaver_wake_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
