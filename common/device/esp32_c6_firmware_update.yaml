# =============================================================================
# ESP32-C6 CO-PROCESSOR FIRMWARE UPDATE
# =============================================================================
# Adds automatic and manual ESP32-C6 hosted firmware updates on ESP32-P4
# devices that use an ESP32-C6 Wi-Fi co-processor. Automatic installation is
# enabled by default and can be disabled from the setup page or Home Assistant.
# =============================================================================

script:
  # ESPHome's esp32_hosted updater publishes UPDATE_STATE_AVAILABLE but does not
  # fire its on_update_available trigger. Own the check/install sequence here so
  # automatic updates remain reliable without changing the manual controls.
  - id: c6_check_and_install_update
    mode: single
    then:
      - update.check:
          id: esp32_c6_update
      - wait_until:
          condition:
            update.is_available: esp32_c6_update
          timeout: 30s
      - if:
          condition:
            and:
              - switch.is_on: c6_auto_update_switch
              - update.is_available: esp32_c6_update
          then:
            - logger.log:
                level: WARN
                format: "Automatically installing ESP32-C6 firmware update..."
            - update.perform:
                id: esp32_c6_update

update:
  - platform: esp32_hosted
    id: esp32_c6_update
    type: http
    http_request_id: http_req
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: never

switch:
  - platform: template
    name: "${entity_esp32_c6_auto_update}"
    id: c6_auto_update_switch
    entity_category: CONFIG
    icon: mdi:update
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: c6_check_and_install_update

interval:
  - interval: 24h
    startup_delay: 1min
    then:
      - script.execute: c6_check_and_install_update

# Retry after late or recovered connectivity without bypassing the one-minute
# boot delay when WiFi connects normally during startup.
wifi:
  on_connect:
    - if:
        condition:
          lambda: 'return millis() >= 60000;'
        then:
          - script.wait: c6_check_and_install_update
          - script.execute: c6_check_and_install_update

text_sensor:
  - platform: template
    name: "ESP32-C6: Update Available"
    entity_category: DIAGNOSTIC
    id: c6_update_available
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string(espcontrol_i18n("Unknown"));
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_UNKNOWN)
        return std::string(espcontrol_i18n("Unknown"));
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_AVAILABLE)
        return std::string(espcontrol_i18n("Update available"));
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_NO_UPDATE)
        return std::string(espcontrol_i18n("Up-to-date"));
      return std::string(espcontrol_i18n("Unknown"));
    update_interval: 60s

  - platform: template
    name: "ESP32-C6: Current Firmware"
    entity_category: DIAGNOSTIC
    id: c6_update_current_firmware
    icon: mdi:chip
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string(espcontrol_i18n("Unknown"));
      auto &cur = upd->update_info.current_version;
      if (cur.empty()) return std::string(espcontrol_i18n("Unknown"));
      return cur;
    update_interval: 60s

  - platform: template
    name: "ESP32-C6: Latest Firmware"
    entity_category: DIAGNOSTIC
    id: c6_update_latest_firmware
    icon: mdi:chip
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string(espcontrol_i18n("Unknown"));
      auto &lat = upd->update_info.latest_version;
      if (!lat.empty()) return lat;
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_NO_UPDATE) {
        auto &cur = upd->update_info.current_version;
        if (!cur.empty()) return cur;
      }
      return std::string(espcontrol_i18n("Unknown"));
    update_interval: 60s

button:
  - platform: template
    name: "Firmware ESP32-C6: Install Update"
    entity_category: CONFIG
    icon: mdi:download
    on_press:
      then:
        - logger.log:
            level: WARN
            format: "Installing ESP32-C6 firmware update..."
        - update.perform:
            id: esp32_c6_update

  - platform: template
    name: "Firmware ESP32-C6: Check for Update"
    entity_category: CONFIG
    icon: mdi:update
    on_press:
      then:
        - logger.log:
            level: WARN
            format: "Checking if ESP32-C6 firmware update is available..."
        - update.check:
            id: esp32_c6_update
