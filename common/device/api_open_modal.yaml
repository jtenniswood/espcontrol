# Open existing entity controls without activating the card's normal command.
api:
  actions:
    - action: open_modal
      variables:
        entity_id: string
      then:
        - script.stop: open_remote_subpage
        - script.execute:
            id: open_entity_modal
            entity_id: !lambda 'return entity_id;'
    - action: close_modal
      then:
        - script.stop: open_entity_modal
        - script.stop: open_remote_subpage
        - lambda: 'espcontrol_close_modal();'
    - action: close_subpage
      then:
        - script.stop: open_entity_modal
        - script.stop: open_remote_subpage
        - lambda: 'espcontrol_close_subpage(id(main_page)->obj);'
    - action: open_subpage
      variables:
        label: string
      then:
        - script.stop: open_entity_modal
        - script.execute:
            id: open_remote_subpage
            label: !lambda 'return label;'

script:
  - id: open_entity_modal
    mode: restart
    parameters:
      entity_id: string
    then:
      - if:
          condition:
            lambda: |-
              return espcontrol_can_open_modal(entity_id,
                !id(connectivity_setup_display_active) &&
                grid_phase2_complete() &&
                !navigation_home_targets().empty());
          then:
            - script.execute: screensaver_wake
            - script.wait: screensaver_wake
            - if:
                condition:
                  lambda: |-
                    return espcontrol_open_modal(entity_id,
                      !id(connectivity_setup_display_active) &&
                      grid_phase2_complete() &&
                      !navigation_home_targets().empty());
                then:
                  - script.execute: screensaver_idle_check
                  - script.execute: home_screen_idle_check

  - id: open_remote_subpage
    mode: restart
    parameters:
      label: string
    then:
      - if:
          condition:
            lambda: |-
              return espcontrol_can_open_subpage(label,
                !id(connectivity_setup_display_active) &&
                grid_phase2_complete() &&
                !navigation_home_targets().empty());
          then:
            - script.execute: screensaver_wake
            - script.wait: screensaver_wake
            - if:
                condition:
                  lambda: |-
                    return espcontrol_can_open_subpage(label,
                      !id(connectivity_setup_display_active) &&
                      grid_phase2_complete() &&
                      !navigation_home_targets().empty());
                then:
                  - lambda: |-
                      espcontrol_open_subpage(label,
                        !id(connectivity_setup_display_active) &&
                        grid_phase2_complete() &&
                        !navigation_home_targets().empty(),
                        id(main_page)->obj);
                  - script.execute: screensaver_idle_check
                  - script.execute: home_screen_idle_check
