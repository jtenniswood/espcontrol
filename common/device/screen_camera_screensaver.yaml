# =============================================================================
# CAMERA SCREENSAVER - Full-screen Home Assistant camera or image overlay
# =============================================================================
# Kept separate from the card image pool: this resource belongs to the display
# mode, so enabling it never takes one of the dashboard camera-card slots.

globals:
  - id: camera_screensaver_transition_generation
    type: uint32_t
    initial_value: '0'
  - id: camera_screensaver_subscribed_entity
    type: std::string
    initial_value: '""'
  - id: camera_screensaver_subscribed_generation
    type: uint32_t
    initial_value: '0'
  - id: camera_screensaver_access_token
    type: std::string
    initial_value: '""'
  - id: camera_screensaver_image_available
    type: bool
    initial_value: 'false'
  - id: camera_screensaver_request_pending
    type: bool
    initial_value: 'false'

artwork_image:
  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: camera_screensaver_downloaded_image
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: ${screen_width}x${screen_height}
    resize_mode: FIT
    priority: COVER_ART
    buffer_size: 65536
    allow_insecure_local_urls: true
    on_download_finished:
      - if:
          condition:
            lambda: |-
              return id(camera_screensaver_transition_generation) != 0 &&
                     id(espcontrol_app).display().transition_is_current(
                       id(camera_screensaver_transition_generation),
                       espcontrol::DisplayMode::CAMERA);
          then:
            - globals.set: { id: camera_screensaver_image_available, value: 'true' }
            - lambda: |-
                auto *img = id(camera_screensaver_downloaded_image);
                ESP_LOGI("camera_screensaver", "Applying camera image=%dx%d content=%dx%d offset=%d,%d",
                         img->get_width(), img->get_height(), img->get_content_width(), img->get_content_height(),
                         img->get_content_offset_x(), img->get_content_offset_y());
                #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
                ::lv_image_set_src(id(camera_screensaver_image), static_cast<const void *>(nullptr));
                #else
                ::lv_img_set_src(id(camera_screensaver_image), static_cast<const void *>(nullptr));
                #endif
                lv_obj_invalidate(id(camera_screensaver_image));
            - lvgl.image.update:
                id: camera_screensaver_image
                src: camera_screensaver_downloaded_image
            - lvgl.widget.hide: camera_screensaver_unavailable
            - lvgl.widget.show: camera_screensaver_image
    on_error:
      - if:
          condition:
            lambda: 'return !id(camera_screensaver_image_available);'
          then:
            - lvgl.widget.show: camera_screensaver_unavailable
      - if:
          condition:
            lambda: 'return id(espcontrol_app).display().target_mode_is(espcontrol::DisplayMode::CAMERA);'
          then:
            - script.execute: camera_screensaver_retry

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(espcontrol_app).display().target_mode_is(
                       espcontrol::DisplayMode::CAMERA) &&
                     id(camera_screensaver_subscribed_generation) !=
                       ha_subscription_generation();
          then:
            - script.execute: camera_screensaver_request_image

lvgl:
  top_layer:
    widgets:
      - obj:
          id: camera_screensaver
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - image:
                id: camera_screensaver_image
                align: CENTER
                src: camera_screensaver_downloaded_image
                hidden: true
            - label:
                id: camera_screensaver_unavailable
                align: CENTER
                text: !lambda 'return std::string(espcontrol_i18n_key("unavailable"));'
                text_color: 0x777777
                text_font: ${label_font}
                hidden: true

script:
  - id: camera_screensaver_config_changed
    mode: restart
    then:
      - lambda: |-
          ha_release_callbacks_for_owner(&id(camera_screensaver_subscribed_entity));
          id(camera_screensaver_downloaded_image)->cancel_update();
      - globals.set: { id: camera_screensaver_subscribed_entity, value: '""' }
      - globals.set: { id: camera_screensaver_subscribed_generation, value: '0' }
      - globals.set: { id: camera_screensaver_image_available, value: 'false' }
      - lvgl.widget.hide: camera_screensaver_image
      - lvgl.widget.show: camera_screensaver_unavailable
      - globals.set: { id: camera_screensaver_access_token, value: '""' }
      - globals.set: { id: camera_screensaver_request_pending, value: 'false' }
      - if:
          condition:
            lambda: 'return id(espcontrol_app).display().target_mode_is(espcontrol::DisplayMode::CAMERA);'
          then:
            - script.execute: camera_screensaver_request_image

  - id: camera_screensaver_request_image
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return ${screensaver_camera_supported} &&
                     id(espcontrol_app).display().target_mode_is(espcontrol::DisplayMode::CAMERA);
          then:
            - lambda: |-
                const std::string entity = id(screensaver_camera_entity).state;
                if (!image_card_entity_supported(entity)) {
                  id(camera_screensaver_show_unavailable).execute();
                  return;
                }
                if (id(cover_art_home_assistant_base_url).empty()) {
                  id(cover_art_resolve_home_assistant_base_url).execute();
                  id(camera_screensaver_retry).execute();
                  return;
                }
                const uint32_t subscription_generation = ha_subscription_generation();
                void *const camera_owner = &id(camera_screensaver_subscribed_entity);
                if (id(camera_screensaver_subscribed_entity) != entity ||
                    id(camera_screensaver_subscribed_generation) != subscription_generation) {
                  ha_release_callbacks_for_owner(camera_owner);
                  id(camera_screensaver_subscribed_entity) = entity;
                  id(camera_screensaver_subscribed_generation) = subscription_generation;
                  id(camera_screensaver_access_token).clear();
                  id(camera_screensaver_request_pending) = false;
                  {
                    HaCallbackOwnerScope camera_subscription_owner(camera_owner);
                    ha_subscribe_state(entity,
                      std::function<void(esphome::StringRef)>([entity, subscription_generation](esphome::StringRef) {
                        if (subscription_generation != ha_subscription_generation() ||
                            entity != id(screensaver_camera_entity).state) return;
                        id(camera_screensaver_request_image).execute();
                      }));
                    ha_subscribe_attribute(entity, std::string("access_token"),
                      std::function<void(esphome::StringRef)>([entity, subscription_generation](esphome::StringRef token) {
                        if (subscription_generation != ha_subscription_generation() ||
                            entity != id(screensaver_camera_entity).state) return;
                        const std::string next = string_ref_limited(token, 512);
                        id(camera_screensaver_request_pending) = false;
                        if (!image_card_valid_access_token(next)) {
                          id(camera_screensaver_access_token).clear();
                          return;
                        }
                        if (next == id(camera_screensaver_access_token)) return;
                        id(camera_screensaver_access_token) = next;
                        id(camera_screensaver_request_image).execute();
                      }),
                      HA_SUBSCRIPTION_SCOPE_DEFAULT,
                      true);
                  }
                  ha_reannounce_state_subscriptions();
                }
                if (image_card_valid_access_token(id(camera_screensaver_access_token))) {
                  const std::string path = image_card_proxy_path_with_token(
                    image_card_entity_proxy_path(entity), id(camera_screensaver_access_token));
                  std::string url = image_card_join_url(id(cover_art_home_assistant_base_url), path);
                  url = image_card_sized_url(url, ${screen_width}, ${screen_height});
                  url = image_card_append_query_param(url, "time", static_cast<int>(millis()));
                  id(camera_screensaver_request_pending) = false;
                  if (!url.empty()) id(camera_screensaver_downloaded_image)->request_update_url(url);
                  return;
                }
                if (id(camera_screensaver_request_pending)) return;
                id(camera_screensaver_request_pending) = true;
                const bool requested = ha_read_retained_attribute(
                  entity, std::string("access_token"),
                  std::function<void(esphome::StringRef)>([entity, subscription_generation](esphome::StringRef token) {
                    id(camera_screensaver_request_pending) = false;
                    if (subscription_generation != ha_subscription_generation() ||
                        entity != id(screensaver_camera_entity).state) return;
                    const std::string next = string_ref_limited(token, 512);
                    if (!image_card_valid_access_token(next)) {
                      id(camera_screensaver_show_unavailable).execute();
                      id(camera_screensaver_retry).execute();
                      return;
                    }
                    id(camera_screensaver_access_token) = next;
                    id(camera_screensaver_request_image).execute();
                  }), camera_owner);
                if (!requested) {
                  id(camera_screensaver_request_pending) = false;
                  id(camera_screensaver_show_unavailable).execute();
                  id(camera_screensaver_retry).execute();
                }

  - id: camera_screensaver_retry
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(espcontrol_app).display().target_mode_is(espcontrol::DisplayMode::CAMERA);'
          then:
            - script.execute: camera_screensaver_request_image

  - id: camera_screensaver_show_unavailable
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(camera_screensaver_image_available);'
          then:
            - lvgl.widget.hide: camera_screensaver_image
            - lvgl.widget.show: camera_screensaver_unavailable

  - id: display_mode_effect_camera
    mode: restart
    parameters:
      generation: int
    then:
      - script.stop: show_clock_view
      - script.stop: show_dimmed_view
      - script.stop: backlight_sleep_display_off
      - lvgl.resume:
      - lambda: 'navigation_return_home(id(main_page)->obj);'
      - script.execute: hide_clock_view
      - script.execute: clock_bar_apply
      - lvgl.widget.hide: dim_screensaver_touch_guard
      - globals.set:
          id: camera_screensaver_transition_generation
          value: !lambda 'return static_cast<uint32_t>(generation);'
      - lvgl.widget.show: camera_screensaver
      - lambda: 'lv_obj_move_foreground(id(camera_screensaver));'
      - script.execute: backlight_apply_brightness
      - script.execute: camera_screensaver_request_image

  - id: camera_screensaver_hide_effect
    mode: restart
    parameters:
      generation: int
      target_mode: int
    then:
      - script.stop: camera_screensaver_request_image
      - script.stop: camera_screensaver_retry
      - globals.set: { id: camera_screensaver_transition_generation, value: '0' }
      - lvgl.widget.hide: camera_screensaver
