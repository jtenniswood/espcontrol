# =============================================================================
# SCREEN: WIFI SETUP
# =============================================================================
# Captive portal instructions shown when WiFi is disconnected.
# =============================================================================

esphome:
  on_boot:
    - priority: -210
      then:
        - lambda: 'register_theme_static_page(id(wifi_setup_page)->obj);'

lvgl:
  pages:
    - id: wifi_setup_page
      bg_color: $theme_background_color
      scrollable: false
      pad_all: 0
      widgets:
        - obj:
            width: $screen_width
            height: $screen_height
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: true
            on_press:
              then:
                - script.execute: setup_screen_dim_cancel
                - script.execute:
                    id: backlight_note_internal_brightness
                    brightness: 0.9
                - light.turn_on:
                    id: display_backlight
                    brightness: 90%
                - script.execute: setup_screen_dim
            widgets:
              - obj:
                  align: center
                  width: $content_width
                  height: SIZE_CONTENT
                  bg_opa: 0%
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: $setup_pad_row
                  widgets:
                    - label:
                        text_font: $setup_icon_font_id
                        text: $icon_wifi_startup
                        text_color: $theme_text_primary_color
                        text_align: center
                    - label:
                        id: wifi_setup_title
                        text: ""
                        text_font: $setup_title_font_id
                        text_color: $theme_text_primary_color
                        width: $content_width
                        text_align: center
                    - label:
                        id: wifi_setup_instructions
                        text: ""
                        text_font: $setup_body_font_id
                        text_color: $theme_text_muted_color
                        width: $content_width
                        text_align: center

script:
  - id: network_setup_text_refresh
    mode: restart
    then:
      - lambda: |-
          lv_label_set_text(id(wifi_setup_title), espcontrol_i18n("Configure your WiFi"));
          std::string hotspot_ssid = wifi::global_wifi_component->get_ap().get_ssid().str();
          if (hotspot_ssid.empty()) hotspot_ssid = "${friendly_name}";
          std::string msg = std::string(espcontrol_i18n_key("connect_to")) +
                            " '" + hotspot_ssid + "' " +
                            espcontrol_i18n_key("to_configure_your_network_settings");
          lv_label_set_display_text(id(wifi_setup_instructions), msg.c_str());
