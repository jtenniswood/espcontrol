# =============================================================================
# THEME: BUTTON - Sizing, colors, and LVGL style for control buttons
# =============================================================================
# Button accent and invisible border defaults, plus the LVGL style definition
# and theme overrides applied to all buttons on the
# main page. The "checked" state reflects an entity that is currently on.
# =============================================================================

# ---------------------------------------------------------------------------
# Button-specific substitutions. Neutral UI colors live in colors.yaml.
# ---------------------------------------------------------------------------
substitutions:
  button_on_color: "0xFF8C00"
  # Border width is zero; preserve its existing black color independently of
  # the visible semantic border color.
  button_border_color: "0x000000"
  button_border_width: "0"

lvgl:
  # ---------------------------------------------------------------------------
  # Style: "control" (applied to each button via styles: control)
  # ---------------------------------------------------------------------------
  style_definitions:
    - id: control
      bg_color: $theme_surface_primary_color
      border_color: $button_border_color
      border_width: $button_border_width

  # ---------------------------------------------------------------------------
  # Theme: global button defaults and checked (on) state
  # ---------------------------------------------------------------------------
  theme:
    button:
      text_font: $label_font
      scroll_on_focus: false
      radius: $radius
      pad_all: $padding
      shadow_width: 0
      text_color: $theme_text_primary_color
      border_color: $button_border_color
      border_width: $button_border_width
      pressed:
        bg_color: $button_on_color
        border_color: $button_border_color
        border_width: $button_border_width
      checked:
        bg_color: $button_on_color
        # Accent foreground is independent of the neutral Light/Dark text role.
        text_color: 0xFFFFFF
        border_color: $button_border_color
        border_width: $button_border_width
