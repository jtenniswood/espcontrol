# =============================================================================
# DEV CONFIG - Local development entry point (7" P4 panel)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../../common/assets/cover_art_placeholder.svg"
  name: "espcontrol-7inch-p4"
  friendly_name: "EspControl 7inch P4"
  espcontrol_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espcontrol_component_ref: "HEAD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  # Keep the full editor out of the ESP32-P4 executable. Embedding the current
  # bundle makes the 7-inch OTA trial image reset before it can start Wi-Fi.
  js_url: "https://cdn.jsdelivr.net/gh/jtenniswood/espcontrol@742365f04/docs/public/webserver/www.js?device=${device_slug}"

packages:
  espcontrol: !include packages.yaml
