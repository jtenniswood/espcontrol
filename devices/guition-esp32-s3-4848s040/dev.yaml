# =============================================================================
# DEV CONFIG - Local development entry point (4" S3 square panel)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../../common/assets/cover_art_placeholder.svg"
  name: "espcontrol-4inch-s3"
  friendly_name: "EspControl 4inch S3"
  espcontrol_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espcontrol_component_ref: "HEAD"

esp32:
  partitions: "../../common/device/partitions_16mb_card_images.csv"

# Keep multiple development displays independently addressable on the same
# network. The suffix is derived from the device MAC, so it remains stable
# across DHCP changes and firmware updates.
esphome:
  name_add_mac_suffix: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espcontrol: !include packages.yaml

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/embedded/www.js"
