# =============================================================================
# LVGL MAIN PAGE - Top-layer HUD and button grid
# =============================================================================
# Defines the primary UI: a top-layer overlay with temperature and clock
# labels, and the main page containing a 3x3 grid of 9 button widgets.
# Uses LVGL grid layout for sparse cell placement on the 480x480 display.
# pad_top clears the top-layer clock bar with a little breathing room.
# sensors.yaml unhides and places active ones at boot via grid cell coords.
# =============================================================================

lvgl:
  # ---------------------------------------------------------------------------
  # Top layer (always visible above all pages)
  # ---------------------------------------------------------------------------
  top_layer:
    widgets:
      # Indoor/outdoor temperature (top-left)
      - label:
          text: "-°C"
          id: temperatures
          text_font: font_text_body
          align: top_left
          x: 8
          y: 8
          text_color: 0xFFFFFF
          hidden: true
      # Clock (top-center, updated every minute by time.yaml)
      - label:
          text: "--:--"
          id: display_time
          text_font: font_text_body
          align: top_mid
          x: 0
          y: 8
          text_align: center
          text_color: 0xFFFFFF
          hidden: true
      # Network status (tappable, right side of clock bar)
      - obj:
          id: network_status_button
          align: top_right
          x: -8
          y: 1
          width: 48
          height: 44
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: network_status_icon_label
                text: "\U000F0928"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
          on_press:
            then:
              - script.execute: network_status_open_info
          on_long_press:
            then:
              - lambda: |-
                  esphome::companion::begin_companion_pairing();
                  network_status_open_text_modal(
                    "Mac Companion pairing",
                    esphome::companion::companion_pairing_code(),
                    "Enter this code in the Mac app",
                    id(${media_title_font})->get_lv_font(),
                    id(${icon_font})->get_lv_font());

      # Mac Companion connection status. Pairing is physically authorized by
      # holding the network icon; this remains a status-only indicator.
      - obj:
          id: companion_status_icon
          align: top_right
          x: 0
          y: 0
          width: 48
          height: 44
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: false
          hidden: true
          widgets:
            - label:
                id: companion_status_icon_label
                text: "\U000F0379"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF

      # Night mode indicator (schedule night period only). Starts hidden;
      # clock_bar_apply positions and reveals it beside the network icon, so the
      # x/y here are unused placeholders.
      - obj:
          id: night_mode_status_icon
          align: top_right
          x: 0
          y: 0
          width: 48
          height: 44
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: false
          hidden: true
          widgets:
            - label:
                id: night_mode_status_icon_label
                text: "\U000F00DC"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF

  # ---------------------------------------------------------------------------
  # Main page (fixed 3x3 grid of button widgets)
  # ---------------------------------------------------------------------------
  pages:
    - id: main_page
      scrollbar_mode: "off"
      layout:
        type: grid
        grid_columns: [FR(1), FR(1), FR(1)]
        grid_rows: [FR(1), FR(1), FR(1)]
        pad_row: ${main_page_card_gap}
        pad_column: ${main_page_card_gap}
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: ${main_page_pad_top}
      pad_bottom: 4
      pad_left: 5
      pad_right: 5

      widgets:
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "1" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "2" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "3" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "4" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "5" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "6" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "7" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "8" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "9" } }

interval:
  - interval: 500ms
    then:
      - lambda: |-
          // Grid construction owns Companion card registration. Runtime
          // updates set the refresh flag, so consume only real changes instead
          // of reparsing every card and repainting twice a second while idle.
          companion_refresh_cards_if_requested();
          navigation_return_from_companion_shortcuts_if_needed(id(main_page)->obj);
          navigation_open_companion_subpage_if_requested(id(main_page)->obj);
          navigation_refresh_companion_subpage_label();
          refresh_clock_bar_temperature_label_values(
              id(main_page)->obj,
              clock_bar_should_show(
                  id(clock_bar_enabled).state,
                  id(main_page)->obj,
                  id(espcontrol_app).display().current_mode(),
                  id(espcontrol_app).display().target_schedule_inactive()),
              id(indoor_temp_enable).state,
              id(outdoor_temp_enable).state,
              id(indoor_temp), id(outdoor_temp));
          static bool previous_companion_connection = false;
          const bool connected = companion_connected();
          if (connected != previous_companion_connection) {
            previous_companion_connection = connected;
            id(clock_bar_apply).execute();
          }
