# =============================================================================
# SENSORS - Dynamic HA entity subscriptions (Waveshare P4 - 9 buttons, 3x3 grid)
# =============================================================================
# Thin wiring layer: builds id()-based arrays and calls shared C++ functions
# from button_grid.h for all grid layout, HA subscriptions, and subpage logic.
# =============================================================================

globals:
  - id: indoor_temp
    type: float
    initial_value: 'NAN'
  - id: outdoor_temp
    type: float
    initial_value: 'NAN'

script:
  - id: refresh_button_grid
    mode: restart
    then:
      - delay: 3s
      - script.execute: apply_button_grid
  - id: apply_button_grid
    mode: single
    then:
      - lambda: |-
          // BEGIN GENERATED REFRESH GRID WIRING
          // Generated by scripts/generate_device_slots.py from devices/manifest.json.
          // Setup pages own the display until connectivity is configured.
          // There is no visible grid to refresh during that flow.
          if (id(connectivity_setup_display_active)) {
            ESP_LOGI("sensors", "Skipping refresh grid during connectivity onboarding");
            return;
          }
          #define BTN_SLOT(n) { button_##n##_config, button_##n, button_##n##_icon_label, button_##n##_text_label, button_##n##_sensor_container, button_##n##_sensor_label, button_##n##_unit_label, button_##n##_subpage_label }
          BtnSlot slots[] = {
            BTN_SLOT(1),
            BTN_SLOT(2),
            BTN_SLOT(3),
            BTN_SLOT(4),
            BTN_SLOT(5),
            BTN_SLOT(6),
            BTN_SLOT(7),
            BTN_SLOT(8),
            BTN_SLOT(9),
          };
          #undef BTN_SLOT
          if (!id(screen_rotation_ready)) return;
          GridConfig cfg = {};
          cfg.num_slots = 9;
          cfg.cols = 3;
          cfg.subpage_chevrons_enabled = id(subpage_chevrons_enabled).state;
          cfg.card_corner_radius = card_curve_radius(35, id(card_curve_select).current_option());
          cfg.continuous_card_corners = true;
          cfg.label_lines = 2;
          cfg.label_lines_tall = 3;
          cfg.modal_profile.layout_family = DisplayModalLayoutFamily::LARGE_SQUARE;
          cfg.modal_profile.density = DisplayModalDensity::COMFORTABLE;
          cfg.modal_profile.memory_tier = DisplayModalMemoryTier::STANDARD;
          cfg.modal_profile.base_touch_target = 69;
          cfg.icon_font = id(font_icon_main)->get_lv_font();
          cfg.sp_sensor_font = id(font_number_value)->get_lv_font();
          cfg.sp_large_sensor_font = id(font_number_value_large)->get_lv_font();
          cfg.large_sensor_unit_offset_percent = -10;
          cfg.media_title_font = id(font_text_title)->get_lv_font();
          cfg.media_control_title_font = id(font_media_control_title)->get_lv_font();
          cfg.media_cover_art_title_font = id(font_cover_art_title)->get_lv_font();
          cfg.media_cover_art_artist_font = id(font_cover_art_artist)->get_lv_font();
          cfg.volume_number_font = id(font_number_value_large)->get_lv_font();
          cfg.volume_label_font = id(font_text_body)->get_lv_font();
          cfg.small_text_font = id(font_text_small)->get_lv_font();
          cfg.climate_card_icon_font = id(font_icon_card)->get_lv_font();
          cfg.subpage_chevron_font = id(font_icon_status)->get_lv_font();
          cfg.climate_option_title_font = id(font_text_body)->get_lv_font();
          cfg.climate_option_value_font = id(font_text_body)->get_lv_font();
          cfg.temperature_unit = id(temperature_unit_select).current_option();
          cfg.timezone = id(timezone_select).current_option();
          cfg.begin_display_takeover = [](espcontrol::DisplayTakeoverKind kind) {
            id(display_takeover_begin).execute(static_cast<int>(kind));
          };
          cfg.end_display_takeover = [](espcontrol::DisplayTakeoverKind kind) {
            id(display_takeover_end).execute(static_cast<int>(kind));
          };
          static esphome::artwork_image::ArtworkImage *image_card_downloaders[] = {
            id(image_card_download_1),
            id(image_card_download_2),
            id(image_card_download_3),
            id(image_card_download_4),
            id(image_card_download_5),
            id(image_card_download_6),
          };
          cfg.image_card_images = image_card_downloaders;
          cfg.image_card_modal_image = id(image_card_modal_download_1);
          cfg.image_card_image_count = 6;
          register_webhook_sender([](const std::string &url, const std::string &method, const std::string &body, const std::vector<esphome::http_request::Header> &headers) {
            auto response = id(http_req).start(url, method, body, headers);
            if (response == nullptr) {
              ESP_LOGW("webhook", "Webhook %s request failed to start", method.c_str());
              return false;
            }
            int status = response->status_code;
            response->end();
            if (!esphome::http_request::is_success(status)) {
              ESP_LOGW("webhook", "Webhook %s returned HTTP %d", method.c_str(), status);
              return false;
            }
            ESP_LOGI("webhook", "Webhook %s returned HTTP %d", method.c_str(), status);
            return true;
          });
          set_width_compensation_vertical_axis(cfg.width_compensation_vertical);
          set_text_width_compensation_percent(cfg.text_width_compensation_percent);
          apply_text_width_compensation(id(display_time));
          apply_text_width_compensation(id(temperatures));
          apply_text_width_compensation(id(clock_label));
          id(espcontrol_app).request_configuration_text_refresh();
          auto* native = espcontrol::pages::page_native_device();
          if (!native || !native->refresh(cfg, id(button_on_color).state))
            ESP_LOGW("pooled_scene", "Display view refresh could not be prepared");
          // END GENERATED REFRESH GRID WIRING
      - script.execute: clock_bar_apply
  - id: refresh_subpage_grid
    mode: restart
    then:
      - delay: 3s
      - script.execute: apply_button_grid

  - id: refresh_display_sensor_subscriptions
    mode: single
    then:
      - lambda: |-
          lv_obj_t *temperature_labels[] = {
            id(temperatures),
          };
          grid_phase3(
            id(indoor_temp_enable).state,
            id(outdoor_temp_enable).state,
            id(indoor_temp_entity).state,
            id(outdoor_temp_entity).state,
            id(clock_bar_temperature_entities).state,
            &id(indoor_temp), &id(outdoor_temp),
            temperature_labels,
            1,
            id(main_page)->obj,
            id(presence_sensor_entity).state,
            &id(presence_detected),
            id(screen_schedule_sensor_entity).state,
            &id(schedule_presence_detected),
            id(media_player_sleep_prevention_entity).state,
            &id(media_player_playing),
            []() {
              return clock_bar_should_show(
                  id(clock_bar_enabled).state,
                  id(main_page)->obj,
                  id(espcontrol_app).display().current_mode(),
                  id(espcontrol_app).display().target_schedule_inactive());
            },
            []() {
              id(screensaver_presence_wake).execute();
            },
            []() {
              id(screensaver_presence_sleep).execute();
            },
            []() {
              id(screen_schedule_check).execute();
            },
            []() {
              return id(outdoor_temp_enable).state;
            });
          ha_reannounce_state_subscriptions();


esphome:
  on_boot:
    - priority: -100
      then:
        # Native scene startup
        - lambda: |-
            // BEGIN GENERATED NATIVE GRID WIRING
            // Generated by scripts/generate_device_slots.py from devices/manifest.json.
            #define BTN_SLOT(n) { button_##n##_config, button_##n, button_##n##_icon_label, button_##n##_text_label, button_##n##_sensor_container, button_##n##_sensor_label, button_##n##_unit_label, button_##n##_subpage_label }
            BtnSlot slots[] = {
              BTN_SLOT(1),
              BTN_SLOT(2),
              BTN_SLOT(3),
              BTN_SLOT(4),
              BTN_SLOT(5),
              BTN_SLOT(6),
              BTN_SLOT(7),
              BTN_SLOT(8),
              BTN_SLOT(9),
            };
            #undef BTN_SLOT
            GridConfig cfg = {};
            cfg.num_slots = 9;
            cfg.cols = 3;
            cfg.subpage_chevrons_enabled = id(subpage_chevrons_enabled).state;
            cfg.card_corner_radius = card_curve_radius(35, id(card_curve_select).current_option());
            cfg.continuous_card_corners = true;
            cfg.label_lines = 2;
            cfg.label_lines_tall = 3;
            cfg.modal_profile.layout_family = DisplayModalLayoutFamily::LARGE_SQUARE;
            cfg.modal_profile.density = DisplayModalDensity::COMFORTABLE;
            cfg.modal_profile.memory_tier = DisplayModalMemoryTier::STANDARD;
            cfg.modal_profile.base_touch_target = 69;
            cfg.icon_font = id(font_icon_main)->get_lv_font();
            cfg.sp_sensor_font = id(font_number_value)->get_lv_font();
            cfg.sp_large_sensor_font = id(font_number_value_large)->get_lv_font();
            cfg.large_sensor_unit_offset_percent = -10;
            cfg.media_title_font = id(font_text_title)->get_lv_font();
            cfg.media_control_title_font = id(font_media_control_title)->get_lv_font();
            cfg.media_cover_art_title_font = id(font_cover_art_title)->get_lv_font();
            cfg.media_cover_art_artist_font = id(font_cover_art_artist)->get_lv_font();
            cfg.volume_number_font = id(font_number_value_large)->get_lv_font();
            cfg.volume_label_font = id(font_text_body)->get_lv_font();
            cfg.small_text_font = id(font_text_small)->get_lv_font();
            cfg.climate_card_icon_font = id(font_icon_card)->get_lv_font();
            cfg.subpage_chevron_font = id(font_icon_status)->get_lv_font();
            cfg.climate_option_title_font = id(font_text_body)->get_lv_font();
            cfg.climate_option_value_font = id(font_text_body)->get_lv_font();
            cfg.temperature_unit = id(temperature_unit_select).current_option();
            cfg.timezone = id(timezone_select).current_option();
            cfg.begin_display_takeover = [](espcontrol::DisplayTakeoverKind kind) {
              id(display_takeover_begin).execute(static_cast<int>(kind));
            };
            cfg.end_display_takeover = [](espcontrol::DisplayTakeoverKind kind) {
              id(display_takeover_end).execute(static_cast<int>(kind));
            };
            static esphome::artwork_image::ArtworkImage *image_card_downloaders[] = {
              id(image_card_download_1),
              id(image_card_download_2),
              id(image_card_download_3),
              id(image_card_download_4),
              id(image_card_download_5),
              id(image_card_download_6),
            };
            cfg.image_card_images = image_card_downloaders;
            cfg.image_card_modal_image = id(image_card_modal_download_1);
            cfg.image_card_image_count = 6;
            register_webhook_sender([](const std::string &url, const std::string &method, const std::string &body, const std::vector<esphome::http_request::Header> &headers) {
              auto response = id(http_req).start(url, method, body, headers);
              if (response == nullptr) {
                ESP_LOGW("webhook", "Webhook %s request failed to start", method.c_str());
                return false;
              }
              int status = response->status_code;
              response->end();
              if (!esphome::http_request::is_success(status)) {
                ESP_LOGW("webhook", "Webhook %s returned HTTP %d", method.c_str(), status);
                return false;
              }
              ESP_LOGI("webhook", "Webhook %s returned HTTP %d", method.c_str(), status);
              return true;
            });
            set_width_compensation_vertical_axis(cfg.width_compensation_vertical);
            set_text_width_compensation_percent(cfg.text_width_compensation_percent);
            apply_text_width_compensation(id(display_time));
            apply_text_width_compensation(id(temperatures));
            apply_text_width_compensation(id(clock_label));
            const bool native_started = espcontrol::pages::page_native_device_start(
                *id(espcontrol_app), slots, cfg, id(main_page)->obj, id(button_on_color).state,
                {[]() { return !id(connectivity_setup_display_active) && id(screen_rotation_ready); },
                 []() { return !id(screensaver_wake_touch_guard_active); },
                 cfg.begin_display_takeover, cfg.end_display_takeover},
                esphome::App.get_friendly_name().c_str(), "${firmware_version}");
            if (!native_started) ESP_LOGE("pooled_scene", "Native display startup failed; configuration writes are blocked");
            // END GENERATED NATIVE GRID WIRING
        - delay: 100ms

        - script.execute: clock_bar_apply
        - script.execute: time_update
        - delay: 100ms

        # Bind display sensors after the initial grid is ready.
        - script.execute: refresh_display_sensor_subscriptions
        - delay: 500ms
        - script.execute: refresh_button_grid
        - delay: 1500ms
        - script.execute: refresh_button_grid
