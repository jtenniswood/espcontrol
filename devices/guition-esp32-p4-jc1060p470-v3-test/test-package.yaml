# Experimental production-silicon target for issue #2442, not a public profile.
# Hypothesis: V3 retains the V2 LCD, touch, backlight and C6 wiring.
packages:
  v2: !include ../guition-esp32-p4-jc1060p470-v2/packages.yaml

substitutions:
  name: "espctl-7v3-test"
  friendly_name: "EspControl 7inch V3 Test"
  firmware_version: "dev-7v3-test"
  espcontrol_component_ref: "test-jc1060p470-v3"
  cover_art_placeholder_file: "https://raw.githubusercontent.com/jtenniswood/espcontrol/${espcontrol_component_ref}/common/assets/cover_art_placeholder.svg"
  # Reuse V2's layout identity, but never its release/update channel.
  firmware_manifest_slug: "guition-esp32-p4-jc1060p470-v3-test"
  disable_updates: "true"
  # Keep hosted WiFi, while omitting the C6 updater during the experiment.
  esp32_c6_firmware_update_package_suffix: "_disabled"

esp32:
  engineering_sample: false

# IDF selects the production P4 PHY clock; this component also corrects DPI
# timing to the clock actually generated by the hardware divider.
external_components:
  - source:
      type: git
      url: ${espcontrol_component_url}
      ref: ${espcontrol_component_ref}
      path: components
    components: [mipi_dsi]
    refresh: 1s

web_server:
  ota: false
  # Manual builds need the full branch editor, not the release-manifest bridge.
  js_url: "https://cdn.jsdelivr.net/gh/jtenniswood/espcontrol@${espcontrol_component_ref}/docs/public/webserver/embedded/www.js?device=${device_slug}&v=${firmware_version}"

esphome:
  min_version: 2026.10.2
  on_boot:
    - priority: -100
      then:
        - logger.log:
            level: WARN
            format: "JC1060P470 V3 TEST: branch-built firmware only; P4 and C6 updaters omitted."
