# =============================================================================
# NETWORK CO-PROCESSOR - WiFi firmware variant
# =============================================================================
# The 7" panel uses an ESP32-C6 co-processor for hosted WiFi/BLE over SDIO.
# This is only needed by the normal WiFi firmware.
# =============================================================================

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  # The V2 (new panel) boards show a fixed band of vertical streaks on the
  # MIPI-DSI panel whenever the ESP32-C6 SDIO link runs at 20MHz (interference
  # into the DSI stream; unaffected by DPI timing or lane rate). 10MHz removes
  # it completely and still leaves ample bandwidth for Home Assistant traffic
  # and cover art. Verified on a JC1060P470C_I_W_Y / ESP32-P4 rev 1.3 unit.
  sdio_frequency: 10MHz
