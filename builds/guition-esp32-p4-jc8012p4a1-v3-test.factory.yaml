# USB-only experimental factory build; deliberately absent from the device matrix.
packages:
  api_encryption: !include ../common/addon/api_encryption_dynamic.yaml
  v3: !include ../devices/guition-esp32-p4-jc8012p4a1-v3-test/test-package.yaml

substitutions:
  name: "espctl-v3-test"
  friendly_name: "EspControl 10inch V3 Test"
  firmware_version: "dev-v3-test"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"
  cover_art_placeholder_file: "../common/assets/cover_art_placeholder.svg"
  mdi_font_file: "/config/common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"

# Factory wrapper paths are relative to builds/, not the remote device package.
web_server:
  ota: false
  js_url: ""
  js_include: "../docs/public/webserver/embedded/www.js"

dashboard_import:
  package_import_url: github://jtenniswood/espcontrol/devices/guition-esp32-p4-jc8012p4a1-v3-test/esphome.yaml@test-jc8012p4a1-v3

esp32:
  partitions: "../common/device/partitions_16mb_card_images.csv"

esphome:
  name_add_mac_suffix: true

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
