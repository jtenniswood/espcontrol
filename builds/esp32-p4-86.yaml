# =============================================================================
# BUILD PROFILE - Waveshare ESP32-P4 86 Panel (4" square)
# =============================================================================
# CI/local build entry point for the 720x720 square ESP32-P4 panel.
# Bundles the matching web UI so branch/release builds do not load the shared
# GitHub Pages copy from main.
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../common/assets/cover_art_placeholder.svg"
  name: "espcontrol-p4-86"
  friendly_name: "EspControl P4 86 Panel"
  espcontrol_component_url: "file:///config"
  mdi_font_file: "/config/common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  partition_table_file: "/config/common/device/partitions_32mb_card_images.csv"
  espcontrol_component_ref: "HEAD"
  voice_stt_failure_chime_file: "../devices/esp32-p4-86/device/voice_stt_failure_chime.flac"
  alarm_delay_entry_beep_file: "../devices/esp32-p4-86/device/alarm_delay_entry_beep.flac"
  alarm_delay_exit_beep_file: "../devices/esp32-p4-86/device/alarm_delay_exit_beep.flac"

esp32:
  partitions: "../common/device/partitions_32mb_card_images.csv"

esphome:
  name_add_mac_suffix: true
  on_boot:
    - priority: 800
      then:
        - if:
            condition:
              lambda: 'return !id(factory_wifi_reset_done);'
            then:
              - lambda: |-
                  if (wifi::global_wifi_component != nullptr) {
                    wifi::global_wifi_component->clear_sta();
                  }
                  id(factory_wifi_reset_done) = true;
                  global_preferences->sync();

globals:
  - id: factory_wifi_reset_done
    type: bool
    restore_value: true
    initial_value: 'false'

packages:
  espcontrol: !include ../devices/esp32-p4-86/packages.yaml

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:

web_server:
  js_url: ""
  js_include: "../docs/public/webserver/embedded/www.js"
