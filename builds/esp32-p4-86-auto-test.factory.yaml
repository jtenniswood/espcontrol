# Explicit test target outside the release matrix.
packages:
  factory: !include esp32-p4-86.factory.yaml

substitutions:
  firmware_version: "dev-p4-86-auto"
  disable_updates: "true"

external_components:
  - source:
      type: local
      path: ../components
    components: [mipi_dsi]

display:
  - id: !extend my_display
    # The factory model supplies ST7703. The detection code selects this
    # Waveshare 8904ANT sequence when it identifies a JD9365DA.
    jd9365_init_sequence:
      - delay 120ms
      # Page 0: manufacturer command set unlock and lane configuration
      - [0xE0, 0x00]
      - [0xE1, 0x93]
      - [0xE2, 0x65]
      - [0xE3, 0xF8]
      - [0x80, 0x01]
      # Page 1: power, timing and gamma
      - [0xE0, 0x01]
      - [0x00, 0x00]
