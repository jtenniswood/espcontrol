name: macOS Companion

on:
  pull_request:
    paths:
      - 'macos/Companion/**'
      - 'scripts/generate_macos_icon.swift'
      - 'docs/reference/privacy.md'
      - 'docs/.vitepress/config.mts'
      - '.github/workflows/macos-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify App Store bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Companion tests
        run: swift test --package-path macos/Companion

      - name: Build App Store-safe bundle
        run: ALLOW_ADHOC=1 macos/Companion/Packaging/build_app_store.sh

      - name: Verify bundle metadata and entitlements
        run: |
          APP="macos/Companion/.build/app-store/EspControl Companion.app"
          test -f "${APP}/Contents/Info.plist"
          test -f "${APP}/Contents/Resources/AppIcon.icns"
          test -f "${APP}/Contents/Resources/PrivacyInfo.xcprivacy"
          plutil -lint "${APP}/Contents/Info.plist"
          plutil -lint "${APP}/Contents/Resources/PrivacyInfo.xcprivacy"
          codesign --display --entitlements :- "${APP}"
          ! strings "${APP}/Contents/MacOS/EspControl Companion" | grep -E -q 'MediaRemote\.framework|MRMediaRemote'

      - uses: actions/upload-artifact@v7
        with:
          name: espcontrol-companion-app-store
          path: macos/Companion/.build/app-store/EspControl Companion.app
          if-no-files-found: error
